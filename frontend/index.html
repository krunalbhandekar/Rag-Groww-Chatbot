<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groww Mutual Fund Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-content">
                <div class="logo-circle"></div>
                <h1>MF Assistant</h1>
            </div>
        </header>

        <main class="chat-container">
            <div id="chat-messages" class="chat-messages">
                <!-- Welcome Message -->
                <div class="message bot-message">
                    <div class="message-bubble">
                        Welcome to the Mutual Fund FAQ Assistant! I can answer factual questions about specific HDFC mutual funds on Groww.
                    </div>
                </div>
                
                <!-- Example Questions Container -->
                <div class="example-questions" id="example-questions">
                    <p class="example-title">Try asking:</p>
                    <button class="example-btn">Tell me about HDFC Mid Cap Fund Direct Growth.</button>
                    <button class="example-btn">What details are available for HDFC Large Cap Fund Direct Growth?</button>
                    <button class="example-btn">What is the expense ratio?</button>
                </div>
            </div>
        </main>

        <div class="input-area">
            <form id="chat-form" class="chat-form">
                <input type="text" id="chat-input" placeholder="Ask a factual question..." autocomplete="off" required>
                <button type="submit" id="send-btn" aria-label="Send Message">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
            <div class="disclaimer">
                <strong>Facts-only. No investment advice.</strong> Responses are generated from limited historical sources.
            </div>
        </div>
    </div>
    <script src="/static/config.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
